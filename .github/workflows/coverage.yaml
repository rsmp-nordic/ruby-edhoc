# This workflow measures Ruby and native binding test coverage.

name: Coverage
on: [push]
jobs:
  ruby:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        submodules: recursive
    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: '4.0'
        bundler-cache: true
    - run: bundle exec rake compile
    - run: bundle exec rake coverage
  native:
    timeout-minutes: 20
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v6
      with:
        submodules: recursive
    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: '4.0'
        bundler-cache: true
    - run: bundle exec rake native_coverage
